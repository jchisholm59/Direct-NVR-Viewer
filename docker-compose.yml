services:
  direct-nvr-viewer:
    build: .
    container_name: direct-nvr-viewer
    restart: always
    network_mode: host
    privileged: true
    environment:
      - PORT=3010
      - DATA_DIR=/app/data
      # - GEMINI_API_KEY=your-api-key-here
    volumes:
      # Persist clips
      - nvr_clips:/app/public/clips
      # Persist configuration files
      - nvr_data:/app/data
    env_file:
      - .env

volumes:
  nvr_clips:
  nvr_data:
